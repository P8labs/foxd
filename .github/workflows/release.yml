name: Release Foxd Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
          - target: aarch64-unknown-linux-musl
            arch: arm64
          - target: armv7-unknown-linux-musleabihf
            arch: armv7

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="v${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build ${{ matrix.arch }}
        run: |
          mkdir -p release

          docker buildx build \
            --file Dockerfile.release \
            --build-arg TARGET=${{ matrix.target }} \
            --output type=local,dest=release \
            .

          BIN_NAME="foxd-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}"
          mv release/foxd release/$BIN_NAME
          chmod +x release/$BIN_NAME

          sha256sum release/$BIN_NAME > release/$BIN_NAME.sha256

          ls -lh release

      - uses: actions/upload-artifact@v4
        with:
          name: foxd-${{ matrix.arch }}
          path: release/*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag_name=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Flatten artifacts
        run: |
          mkdir -p final
          find release -type f -exec cp {} final/ \;
          ls -lh final

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          body: |
            ## Foxd LAN Monitoring Daemon

            A local-first LAN monitoring daemon for tracking device presence and automating network events.

            ### Supported Platforms
            - **Linux x86_64** (Intel/AMD 64-bit)
            - **Linux ARM64** (aarch64 - Raspberry Pi 4, ARM servers)
            - **Linux ARMv7** (32-bit ARM - Raspberry Pi 2/3)

            ### Requirements

            **Linux:**
            - Root privileges or `CAP_NET_RAW` + `CAP_NET_ADMIN`
            - `libpcap` installed
            - Uses netlink APIs

            ### Installation

            ```bash
            curl -fsSL https://foxd.p8labs.in/install.sh | sudo bash
            ```

          generate_release_notes: true
          make_latest: true
          files: final/*
