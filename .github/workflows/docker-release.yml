name: Docker Release

on:
  workflow_run:
    workflows: ["Release Foxd Binaries"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g., 1.2.3)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ github.event.inputs.version }}"
          else
            TAG="${{ github.event.workflow_run.head_branch }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download artifacts from triggering workflow
        if: ${{ github.event_name == 'workflow_run' }}
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: Release Foxd Binaries
          run_id: ${{ github.event.workflow_run.id }}
          path: artifacts

      - name: Download latest artifacts (manual fallback)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: Release Foxd Binaries
          workflow_conclusion: success
          event: push
          path: artifacts

      - name: Validate artifacts
        run: |
          if [ -z "$(find artifacts -type f 2>/dev/null)" ]; then
            echo "No artifacts found. Did binary build run?"
            exit 1
          fi

      - name: Prepare binary
        run: |
          BIN=$(find artifacts -name "*linux-${{ matrix.arch }}" | head -n1)
          if [ -z "$BIN" ]; then
            echo "Binary for ${{ matrix.arch }} not found"
            exit 1
          fi

          cp "$BIN" foxd
          chmod +x foxd

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/foxd

          docker buildx build \
            --platform ${{ matrix.platform }} \
            -f Dockerfile.runtime \
            -t $IMAGE:${{ steps.version.outputs.tag }}-${{ matrix.arch }} \
            -t $IMAGE:latest-${{ matrix.arch }} \
            --push \
            .
