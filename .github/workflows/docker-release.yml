name: Docker Release

on:
  workflow_run:
    workflows: ["Release Foxd Binaries"]
    types:
      - completed

  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g., 1.2.3)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ github.event.inputs.version }}"
          else
            TAG="${{ github.event.workflow_run.head_branch }}"
          fi

          if [ -z "$TAG" ]; then
            echo "Failed to determine tag"
            exit 1
          fi

          echo "Using tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download binary + checksum
        run: |
          VERSION=${{ steps.version.outputs.tag }}
          ARCH=${{ matrix.arch }}

          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}"
          BIN="foxd-${VERSION}-linux-${ARCH}"

          echo "Downloading binary..."
          curl -fL "$BASE_URL/$BIN" -o foxd

          echo "Downloading checksum..."
          curl -fL "$BASE_URL/$BIN.sha256" -o foxd.sha256

          chmod +x foxd

      - name: Verify checksum
        run: |
          echo "Verifying checksum..."

          EXPECTED=$(cat foxd.sha256 | tr -d ' \n')
          ACTUAL=$(sha256sum foxd | awk '{print $1}')

          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Checksum mismatch!"
            exit 1
          fi

          echo "Checksum verified."

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (per arch)
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/foxd
          TAG=${{ steps.version.outputs.tag }}

          docker buildx build \
            --platform ${{ matrix.platform }} \
            -f Dockerfile.runtime \
            -t $IMAGE:$TAG-${{ matrix.arch }} \
            -t $IMAGE:latest-${{ matrix.arch }} \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.version=$TAG \
            --push \
            .

  manifest:
    needs: docker
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ github.event.inputs.version }}"
          else
            TAG="${{ github.event.workflow_run.head_branch }}"
          fi

          if [ -z "$TAG" ]; then
            echo "Failed to determine tag"
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/foxd
          TAG=${{ steps.version.outputs.tag }}

          echo "Creating manifest for $TAG"

          docker buildx imagetools create \
            -t $IMAGE:$TAG \
            -t $IMAGE:latest \
            $IMAGE:$TAG-amd64 \
            $IMAGE:$TAG-arm64
