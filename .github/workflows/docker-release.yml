name: Docker Release

on:
  workflow_run:
    workflows: ["Release Foxd Binaries"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g., 1.2.3)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  docker:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64

    steps:
      - uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Prepare binary
        run: |
          BIN=$(find artifacts -name "*linux-${{ matrix.arch }}" | head -n1)
          cp "$BIN" foxd
          chmod +x foxd

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (per arch)
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/foxd

          docker buildx build \
            --platform ${{ matrix.platform }} \
            -f Dockerfile.runtime \
            -t $IMAGE:${{ steps.version.outputs.tag }}-${{ matrix.arch }} \
            -t $IMAGE:latest-${{ matrix.arch }} \
            --push \
            .
  manifest:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/foxd

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          docker buildx imagetools create \
            -t $IMAGE:$TAG \
            -t $IMAGE:latest \
            $IMAGE:$TAG-amd64 \
            $IMAGE:$TAG-arm64
